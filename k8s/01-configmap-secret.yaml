apiVersion: v1
kind: Secret
metadata:
  name: accesszero-secrets
  namespace: accesszero
type: Opaque
stringData:
  POSTGRES_DB: accesszerodb
  POSTGRES_USER: sa
  POSTGRES_PASSWORD: password123
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
  LDAP_ADMIN_PASSWORD: adminpassword
  LDAP_CONFIG_PASSWORD: configpassword
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accesszero-config
  namespace: accesszero
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.accesszero.svc.cluster.local:5432/accesszerodb"
  SPRING_DATASOURCE_DRIVER: "org.postgresql.Driver"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  KEYCLOAK_SERVER_URL: "http://keycloak.accesszero.svc.cluster.local:8081"
  KEYCLOAK_REALM: "accesszero-realm"
  KEYCLOAK_MOCK_MODE: "false"
  LDAP_URL: "ldap://openldap.accesszero.svc.cluster.local:389"
  LDAP_BASE_DN: "dc=company,dc=com"
  LDAP_ADMIN_DN: "cn=admin,dc=company,dc=com"
  LDAP_MOCK_MODE: "false"
