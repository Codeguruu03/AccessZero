apiVersion: apps/v1
kind: Deployment
metadata:
  name: accesszero-api
  namespace: accesszero
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accesszero-api
  template:
    metadata:
      labels:
        app: accesszero-api
    spec:
      containers:
        - name: accesszero-api
          image: accesszero:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: accesszero-config
            - secretRef:
                name: accesszero-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: accesszero-api
  namespace: accesszero
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: accesszero-api
