version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: accesszero-postgres
    environment:
      POSTGRES_DB: accesszerodb
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d accesszerodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: accesszero-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    depends_on:
      - postgres

  openldap:
    image: osixia/openldap:1.5.0
    container_name: accesszero-openldap
    environment:
      LDAP_ORGANISATION: "AccessZero Company"
      LDAP_DOMAIN: "company.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./docker/ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom

volumes:
  postgres_data:
