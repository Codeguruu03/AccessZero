name: AccessZero CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit & Integration Tests
        run: mvn test --batch-mode -Dsurefire.useFile=false -DtrimStackTrace=false

      - name: Build Spring Boot Application Package
        run: mvn package -DskipTests --batch-mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Kubernetes Manifests
        run: |
          pip install --quiet pyyaml
          python -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]; print('All Kubernetes manifests are syntactically valid YAML!')"
          kubectl kustomize k8s/ > /dev/null
          echo "Kubernetes manifests and Kustomize overlays validated successfully!"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: Terraform Format and Validate
        working-directory: ./terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false
          terraform validate
